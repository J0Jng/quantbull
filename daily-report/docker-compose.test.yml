version: '3.8'

services:
  daily-report:
    build: .
    ports:
      - "8004:8004"
    environment:
      - ENV=local
      - LOG_LEVEL=INFO
      - DB_TYPE=sqlite
      - SQLITE_PATH=/app/data/daily_report.db
      - PORT=8004
      - HOST=0.0.0.0
    volumes:
      # 持久化 SQLite 数据库文件
      - ./data:/app/data
    # 确保 data 目录存在
    command: sh -c "mkdir -p /app/data && python -m uvicorn main:app --host 0.0.0.0 --port 8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# Docker Compose for QuantBull backend microservices (production-ready defaults)
# - 所有服务共享自定义网络 `quantbull-net`
# - PostgreSQL, TDengine, Redis 提供持久化卷

networks:
  quantbull-net:
    driver: bridge

volumes:
  pgdata:
  tdengine-data:
  redis-data:
  data-service-static:

services:
  # PostgreSQL：结构化数据持久化
  postgres:
    image: postgres:15-alpine
    container_name: quantbull_postgres
    restart: always
    environment:
      ENV: "${ENV}"
      POSTGRES_USER: "${POSTGRES_USER:-quantbull}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-quantbull_db}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - quantbull-net

  # Redis：缓存与简单队列
  redis:
    image: redis:7-alpine
    container_name: quantbull_redis
    restart: always
    environment:
      ENV: "${ENV}"
    volumes:
      - redis-data:/data
    networks:
      - quantbull-net

  # TDengine：行情 / 时间序列数据库（容器化镜像由 taos 提供）
  tdengine:
    # 使用 TDengine 官方 Docker Hub 镜像（若网络/镜像代理允许）
    # 说明：之前尝试 ghcr 镜像报 not found；若你的网络有镜像加速器导致访问被拦截，
    # 请参考下面的“修复步骤”移除 registry-mirrors 或在 CI/私服中预拉镜像。
    image: tdengine/tdengine:latest
    container_name: quantbull_tdengine
    restart: always
    environment:
      ENV: "${ENV}"
      TZ: Asia/Shanghai
    volumes:
      - tdengine-data:/var/lib/taos
    networks:
      - quantbull-net

  # API Gateway：对外暴露的统一入口（将外网请求路由到各微服务）
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8000:8000" # 仅暴露网关端口到宿主机
    environment:
      ENV: "${ENV}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8000"
      JWT_SECRET: "${JWT_SECRET}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES}"
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME}"
      CSRF_COOKIE_NAME: "${CSRF_COOKIE_NAME}"
      COOKIE_SECURE: "${COOKIE_SECURE}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN}"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      AI_HUB_URL: "http://ai-hub:8002"
      USER_SERVICE_URL: "http://user-service:8005"
    depends_on:
      - postgres
      - redis
      - tdengine
      - data-service
      - ai-hub
      - quant-engine
      - daily-report
      - user-service
    networks:
      - quantbull-net

  # Frontend (Nginx)：静态站点 + /api 反向代理到网关
  # 使用本地构建产物 frontend/niuniu/dist（首次部署请先在服务器构建 dist，或用 CI 生成并随代码发布）
  frontend-nginx:
    image: nginx:1.25-alpine
    container_name: quantbull_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/niuniu/dist:/usr/share/nginx/html:ro
      - ./frontend/niuniu/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      - quantbull-net

  # User Service：统一用户认证中心
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    environment:
      ENV: "${ENV}"
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES}"
      SERVICE_PORT: "8005"
    depends_on:
      - postgres
    networks:
      - quantbull-net

  # Data Service：数据采集 / 清洗（内部服务，不直接映射到宿主）
  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    container_name: data-service
    restart: always
    dns:
      - 8.8.8.8
      - 114.114.114.114
    environment:
      ENV: "${ENV}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS}"
      SYNC_DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8001"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN}"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      AI_HUB_URL: "http://ai-hub:8002"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
      VIDEO_MAX_SIZE_MB: "${VIDEO_MAX_SIZE_MB:-200}"
      VIDEO_COVER_MAX_SIZE_MB: "${VIDEO_COVER_MAX_SIZE_MB:-10}"
    volumes:
      - data-service-static:/app/static
    depends_on:
      - postgres
      - redis
    networks:
      - quantbull-net

  # AI Hub：LLM 网关 & 内容生成
  ai-hub:
    build:
      context: ./ai-hub
      dockerfile: Dockerfile
    container_name: ai-hub
    restart: always
    environment:
      ENV: "${ENV}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL}"
      DEEPSEEK_MAX_CONCURRENCY: "${DEEPSEEK_MAX_CONCURRENCY}"
      DEEPSEEK_RPM: "${DEEPSEEK_RPM}"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      QWEN_BASE_URL: "${QWEN_BASE_URL}"
      QWEN_MODEL: "${QWEN_MODEL}"
      QWEN_MAX_CONCURRENCY: "${QWEN_MAX_CONCURRENCY}"
      QWEN_RPM: "${QWEN_RPM}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

      DEFAULT_MODEL: "${DEFAULT_MODEL}"
      DEFAULT_MODEL_FOR_NEWS: "${DEFAULT_MODEL_FOR_NEWS}"
      DEFAULT_MODEL_FOR_SUMMARY: "${DEFAULT_MODEL_FOR_SUMMARY}"
      DEFAULT_MODEL_FOR_STRATEGY: "${DEFAULT_MODEL_FOR_STRATEGY}"

      MAX_TOKENS: "${MAX_TOKENS}"
      TEMPERATURE: "${TEMPERATURE}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT}"

      DIGITAL_HUMAN_API_URL: "${DIGITAL_HUMAN_API_URL}"
      DIGITAL_HUMAN_API_KEY: "${DIGITAL_HUMAN_API_KEY}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8002"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
    depends_on:
      - redis
      - postgres
    networks:
      - quantbull-net

  # Quant Engine：回测 / 策略执行（依赖 TDengine）
  quant-engine:
    build:
      context: ./quant-engine
      dockerfile: Dockerfile
    container_name: quant-engine
    restart: always
    volumes:
      # 挂载 indicator 模块供内设因子计算使用
      - ./indicator:/app/indicator:ro
    environment:
      ENV: "${ENV}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"

      # quant-engine 代码使用 redis_host/port/db/password，而非 REDIS_URL
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URL: "redis://redis:6379/0"

      # quant-engine 的 TDengine REST 查询需要 user/password/REST 配置
      TDENGINE_HOST: "${TDENGINE_HOST:-tdengine}"
      TDENGINE_PORT: "${TDENGINE_PORT:-6030}"
      TDENGINE_USER: "${TDENGINE_USER:-root}"
      TDENGINE_PASSWORD: "${TDENGINE_PASSWORD}"
      TDENGINE_DATABASE: "${TDENGINE_DATABASE:-quantbull}"
      TDENGINE_REST_PORT: "${TDENGINE_REST_PORT:-6041}"
      TDENGINE_REST_PATH: "${TDENGINE_REST_PATH:-/rest/sql}"
      TDENGINE_REST_SCHEME: "${TDENGINE_REST_SCHEME:-http}"
      TDENGINE_REST_TIMEOUT: "${TDENGINE_REST_TIMEOUT:-10.0}"

      SERVICE_PORT: "8003"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN}"
      DATA_SERVICE_URL: "http://data-service:8001"
      # data-service 侧会调用 Tushare，拉取股票池/批量行情可能较慢；这里调高默认超时并降低每次批量 codes 数
      DATA_SERVICE_TIMEOUT: "180"
      DATA_SERVICE_BATCH_SIZE: "20"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
    depends_on:
      - tdengine
      - postgres
    networks:
      - quantbull-net

  # Task Service：统一异步任务平台（MVP）
  task-service:
    build:
      context: ./task_service
      dockerfile: Dockerfile
    container_name: task-service
    restart: always
    # 生产环境不应直接对外暴露 task-service；请通过 api-gateway 统一入口访问
    environment:
      ENV: "${ENV}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      REDIS_URL: "redis://redis:6379/0"
      SERVICE_PORT: "9000"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
    depends_on:
      - redis
    networks:
      - quantbull-net

  # Task Worker：异步任务执行器
  task-worker:
    build:
      context: ./task_service
      dockerfile: Dockerfile
    container_name: task-worker
    restart: always
    environment:
      ENV: "${ENV}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      REDIS_URL: "redis://redis:6379/0"
      SERVICE_PORT: "9000"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
    command: celery -A task_service.celery_app worker --loglevel=info
    depends_on:
      - postgres
      - redis
    networks:
      - quantbull-net

  # Daily Report：每日 AI 投资方案生成
  daily-report:
    build:
      context: ./daily-report
      dockerfile: Dockerfile
    container_name: daily-report
    restart: always
    environment:
      ENV: "${ENV}"
      RUN_SCHEDULER: "false"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8004"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      TASK_SERVICE_URL: "http://task-service:9000"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
      DB_TYPE: "postgresql"
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "daily_report_user"
      POSTGRES_PASSWORD: "${DAILY_REPORT_DB_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-quantbull_db}"
      POSTGRES_SCHEMA: "daily_report"
    depends_on:
      - ai-hub
      - postgres
      - redis
    networks:
      - quantbull-net

  # Daily Report Scheduler：独立定时任务容器
  daily-report-scheduler:
    build:
      context: ./daily-report
      dockerfile: Dockerfile
    container_name: daily-report-scheduler
    restart: always
    environment:
      ENV: "${ENV}"
      RUN_SCHEDULER: "true"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-quantbull}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantbull_db}"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      TASK_SERVICE_URL: "http://task-service:9000"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
      DB_TYPE: "postgresql"
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "daily_report_user"
      POSTGRES_PASSWORD: "${DAILY_REPORT_DB_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-quantbull_db}"
      POSTGRES_SCHEMA: "daily_report"
    command: python scheduler_runner.py
    depends_on:
      - ai-hub
      - postgres
      - redis
    networks:
      - quantbull-net
# Docker Compose for QuantBull backend microservices (production-ready defaults)
# - 所有服务共享自定义网络 `quantbull-net`
# - PostgreSQL, TDengine, Redis 提供持久化卷

networks:
  quantbull-net:
    driver: bridge

volumes:
  pgdata:
  tdengine-data:
  redis-data:

services:
  # PostgreSQL：结构化数据持久化
  postgres:
    image: postgres:15-alpine
    container_name: quantbull_postgres
    restart: always
    environment:
      POSTGRES_USER: quantbull
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: quantbull_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - quantbull-net

  # Redis：缓存与简单队列
  redis:
    image: redis:7-alpine
    container_name: quantbull_redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - quantbull-net

  # TDengine：行情 / 时间序列数据库（容器化镜像由 taos 提供）
  tdengine:
    # 使用 TDengine 官方 Docker Hub 镜像（若网络/镜像代理允许）
    # 说明：之前尝试 ghcr 镜像报 not found；若你的网络有镜像加速器导致访问被拦截，
    # 请参考下面的“修复步骤”移除 registry-mirrors 或在 CI/私服中预拉镜像。
    image: tdengine/tdengine:latest
    container_name: quantbull_tdengine
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - tdengine-data:/var/lib/taos
    networks:
      - quantbull-net

  # API Gateway：对外暴露的统一入口（将外网请求路由到各微服务）
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8000:8000" # 仅暴露网关端口到宿主机
    environment:
      DATABASE_URL: "postgresql+asyncpg://quantbull:change_me@postgres:5432/quantbull_db"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8000"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      AI_HUB_URL: "http://ai-hub:8002"
      USER_SERVICE_URL: "http://user-service:8005"
    depends_on:
      - postgres
      - redis
      - tdengine
      - data-service
      - ai-hub
      - quant-engine
      - daily-report
      - user-service
    networks:
      - quantbull-net

  # User Service：统一用户认证中心
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    environment:
      DATABASE_URL: "postgresql+psycopg2://quantbull:change_me@postgres:5432/quantbull_db"
      JWT_SECRET: "change-me-in-prod"
      SERVICE_PORT: "8005"
    depends_on:
      - postgres
    networks:
      - quantbull-net

  # Data Service：数据采集 / 清洗（内部服务，不直接映射到宿主）
  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    container_name: data-service
    restart: always
    environment:
      SYNC_DATABASE_URL: "postgresql+psycopg2://quantbull:change_me@postgres:5432/quantbull_db"
      DATABASE_URL: "postgresql+asyncpg://quantbull:change_me@postgres:5432/quantbull_db"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      AI_HUB_URL: "http://ai-hub:8002"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - quantbull-net

  # AI Hub：LLM 网关 & 内容生成
  ai-hub:
    build:
      context: ./ai-hub
      dockerfile: Dockerfile
    container_name: ai-hub
    restart: always
    environment:
      DATABASE_URL: "postgresql+asyncpg://quantbull:change_me@postgres:5432/quantbull_db"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8002"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
    depends_on:
      - redis
      - postgres
    networks:
      - quantbull-net

  # Quant Engine：回测 / 策略执行（依赖 TDengine）
  quant-engine:
    build:
      context: ./quant-engine
      dockerfile: Dockerfile
    container_name: quant-engine
    restart: always
    environment:
      DATABASE_URL: "postgresql+asyncpg://quantbull:change_me@postgres:5432/quantbull_db"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8003"
      DATA_SERVICE_URL: "http://data-service:8001"
      TASK_SERVICE_URL: "http://task-service:9000"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
    depends_on:
      - tdengine
      - postgres
    networks:
      - quantbull-net

  # Task Service：统一异步任务平台（MVP）
  task-service:
    build:
      context: ./task_service
      dockerfile: Dockerfile
    container_name: task-service
    restart: always
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: "postgresql+psycopg://quantbull:change_me@postgres:5432/quantbull_db"
      REDIS_URL: "redis://redis:6379/0"
      SERVICE_PORT: "9000"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
    depends_on:
      - redis
    networks:
      - quantbull-net

  # Task Worker：异步任务执行器
  task-worker:
    build:
      context: ./task_service
      dockerfile: Dockerfile
    container_name: task-worker
    restart: always
    environment:
      DATABASE_URL: "postgresql+psycopg://quantbull:change_me@postgres:5432/quantbull_db"
      REDIS_URL: "redis://redis:6379/0"
      SERVICE_PORT: "9000"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      DAILY_REPORT_URL: "http://daily-report:8004"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
    command: celery -A task_service.celery_app worker --loglevel=info
    depends_on:
      - postgres
      - redis
    networks:
      - quantbull-net

  # Daily Report：每日 AI 投资方案生成
  daily-report:
    build:
      context: ./daily-report
      dockerfile: Dockerfile
    container_name: daily-report
    restart: always
    environment:
      DATABASE_URL: "postgresql+asyncpg://quantbull:change_me@postgres:5432/quantbull_db"
      REDIS_URL: "redis://redis:6379/0"
      TDENGINE_HOST: "tdengine"
      TDENGINE_PORT: "6030"
      SERVICE_PORT: "8004"
      DATA_SERVICE_URL: "http://data-service:8001"
      QUANT_ENGINE_URL: "http://quant-engine:8003"
      TASK_SERVICE_URL: "http://task-service:9000"
      API_GATEWAY_URL: "http://api-gateway:8000"
      AI_HUB_URL: "http://ai-hub:8002"
    depends_on:
      - ai-hub
      - postgres
      - redis
    networks:
      - quantbull-net
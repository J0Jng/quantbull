version: "1.0"

services:
  postgres-quantbull:
    image: postgres:15
    container_name: postgres-quantbull
    restart: always
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    image: data-service
    container_name: data-services
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:password@postgres-quantbull:5432/quant"
    ports:
      - "8000:8000"
    depends_on:
      - postgres-quantbull

volumes:
  pgdata:

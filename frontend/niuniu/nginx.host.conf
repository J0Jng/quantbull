# Host Nginx config for QuantBull frontend (Vite dist) + API reverse proxy
# - Put this file on the server as: /etc/nginx/conf.d/quantbull.conf (recommended)
# - Static root should point to the deployed dist directory
# - /api/ is proxied to the API Gateway on the same host (docker compose exposes 8000)

server {
  listen 80;
  # If you only access via IP, keep server_name as the public IP (or use _)
  server_name <SERVER_IP>;

  # Change to where you deploy the build output (contains index.html, assets/)
  root /var/www/quantbull;
  index index.html;

  client_max_body_size 200m;

  # API reverse proxy
  location /api/ {
    # If api-gateway is published on host via docker (-p 8000:8000), localhost will work.
    proxy_pass http://127.0.0.1:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Vite assets can be cached aggressively
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|ttf|otf|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Do not cache the HTML entry (so deployments take effect immediately)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
